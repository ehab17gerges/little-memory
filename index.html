<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>A Little Memory</title>

  <style>
    :root {
      --bg: #0b0b0d;
      --card: rgba(255,255,255,0.06);
      --text: #f5f2ee;
      --muted: #b9b2aa;
      --accent: #f1d6d0;
      --border: rgba(255,255,255,0.12);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 35%, rgba(241,214,208,0.10), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrap {
      width: min(92vw, 430px);
      text-align: center;
    }

    .card {
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 26px;
      padding: 32px 22px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.34);
    }

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      font-size: 31px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.1;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.6;
      margin: 14px auto 0;
      max-width: 300px;
      font-size: 15px;
    }

    .play-btn {
      margin-top: 28px;
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      color: #1a1514;
      background: var(--accent);
      min-width: 140px;
      transition: transform .2s ease, opacity .2s ease;
    }

    .play-btn:active {
      transform: scale(.97);
    }

    .hint {
      margin-top: 14px;
      color: rgba(255,255,255,.38);
      font-size: 12px;
    }

    .video-view {
      display: none;
      opacity: 0;
      transition: opacity .65s ease;
    }

    .video-view.show {
      display: block;
      opacity: 1;
    }

    .intro.hide {
      display: none;
    }

    video {
      width: 100%;
      max-height: 72vh;
      border-radius: 20px;
      background: #000;
      display: block;
      box-shadow: 0 22px 70px rgba(0,0,0,.45);
    }

    .caption {
      margin: 16px 8px 0;
      font-size: 13px;
      color: rgba(255,255,255,.48);
    }

    .fade {
      animation: fadeUp .8s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section id="intro" class="card intro fade">
      <div class="icon">🐶</div>
      <h1>I left something here for you.</h1>
      <p class="subtitle">
        A small memory, kept quietly in this little gift.
      </p>

      <button id="playButton" class="play-btn" type="button">
        ▶ Play
      </button>

      <div class="hint">Use headphones if you want.</div>
    </section>

    <section id="videoView" class="video-view">
      <video id="memoryVideo" controls playsinline preload="metadata" poster="aaa.jpg">
        <source src="aa.mp4" type="video/mp4" />
        Your browser does not support video playback.
      </video>
      <p class="caption">A little memory for you.</p>
    </section>
  </main>

  <script>
    const playButton = document.getElementById("playButton");
    const intro = document.getElementById("intro");
    const videoView = document.getElementById("videoView");
    const video = document.getElementById("memoryVideo");

    playButton.addEventListener("click", async () => {
      intro.classList.add("hide");
      videoView.classList.add("show");

      try {
        await video.play();
      } catch (e) {
        // Some browsers may still require pressing play in the video controls.
      }
    });
  </script>
</body>
</html>
